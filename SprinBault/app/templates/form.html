<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <!-- Bootstrap CSS desde CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- AdminLTE -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="/static/css/formStyles.css"></link>
</head>
<body class="bg-gradient-custom">
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4 shadow-lg bg-gradient-table" style="width: 100%; max-width: 400px; border-radius: 1rem;">
            <h2 class="etiqueta mb-4 text-left p-2 fw-bold bg-gradient-etiqueta shadow"
                style="border-top-right-radius: 50px; border-bottom-right-radius: 50px; max-width: 250px;">
                Inicio de Sesión</h2>

            <!-- Mostrar mensaje de error si las credenciales son inválidas -->
            <div id="errorMessage" class="alert alert-danger alert-dismissible fade show text-center" role="alert" style="display: none;">
                Credenciales inválidas. Por favor, intente de nuevo.
                <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Mostrar mensaje si el correo no es válido -->
            <div id="invalidEmailMessage" class="alert alert-warning alert-dismissible fade show text-center" role="alert" style="display: none;">
                Por favor, ingrese una dirección de correo válida (por ejemplo, usuario@example.com).
                <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Mostrar mensaje si el token ha expirado -->
            <div id="tokenExpiredMessage" class="alert alert-danger alert-dismissible fade show text-center" role="alert" style="display: none;">
                El token ha expirado. Por favor, inicia sesión de nuevo.
                <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <!-- Mostrar mensaje si el token no fue encontrado -->
            <div id="tokenNotFoundMessage" class="alert alert-warning alert-dismissible fade show text-center" role="alert" style="display: none;">
                Token no encontrado. Inicia sesión de nuevo.
                <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <form action="/login" method="post" onsubmit="return validateEmail()">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" class="form-control form-control-lg rounded" required placeholder="correo@ejemplo.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Contraseña:</label>
                    <input type="password" id="password" name="password" class="form-control form-control-lg rounded" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn bg-gradient-primary text-white btn-lg shadow-sm px-4 mx-1 mb-2 rounded-pill">
                    <i class="fas fa-sign-in me-2"></i> Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- Popper.js (para tooltips, dropdowns, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>

    <!-- Bootstrap JS y dependencias (Popper.js y Bootstrap JS) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="/static/js/formScript.js"></script>
</body>
</html>
