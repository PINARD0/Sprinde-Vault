{% extends "base.html" %}

{% block title %}Verificar Contraseña Maestra | SprinVault{% endblock %}

{% block content %}
<section class="content">
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card p-4 shadow-lg bg-gradient-table" style="width: 100%; max-width: 500px; border-radius: 1rem;">

      <h2 class="etiqueta mb-4 text-left p-2 fw-bold bg-gradient-etiqueta shadow" style="border-top-right-radius: 50px; border-bottom-right-radius: 50px; max-width: 440px;">
        Verificar Contraseña Maestra
      </h2>

      <!-- Mensaje de error -->
      {% if error %}
      <div class="alert alert-danger alert-dismissible fade show text-center" role="alert">
        {{ error }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Cerrar">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      {% endif %}

      <!-- Formulario -->
      <form action="/verify-master-current" method="post">
        <div class="mb-4">
          <label for="current_password" class="form-label fw-bold">Contraseña Maestra Actual:</label>
          <input type="password" id="current_password" name="current_password" class="form-control form-control-lg rounded" required placeholder="••••••••">
        </div>

        <div class="d-flex justify-content-center flex-wrap">
          <button type="submit" class="btn bg-gradient-success text-white btn-lg shadow-sm px-4 mx-1 mb-2 rounded-pill">
            <i class="fas fa-check me-2"></i> Verificar
          </button>
          <a href="/dashboard" class="btn bg-gradient-dark text-white btn-lg shadow-sm px-4 mx-1 mb-2 rounded-pill" role="button">
            <i class="fas fa-arrow-left me-2"></i> Volver
          </a>
        </div>
      </form>

    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="/static/js/verify_masterScript.js"></script>
{% endblock %}
